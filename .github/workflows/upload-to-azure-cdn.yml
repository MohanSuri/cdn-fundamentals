name: Upload Assets to Azure CDN

on:
  push:
    branches:
      - main
      - copilot/create-basic-react-app
    paths:
      - 'assets/**'
  workflow_dispatch:

jobs:
  upload-to-azure-cdn:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to Azure Storage (CDN Origin)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            # Upload assets to Azure Blob Storage (CDN origin)
            az storage blob upload-batch \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --destination '$web' \
              --source ./assets \
              --overwrite true
            
            echo "Assets uploaded successfully to Azure CDN origin"

      - name: Purge Azure CDN Cache
        uses: azure/CLI@v2
        with:
          inlineScript: |
            # Purge CDN cache to refresh content
            if [ ! -z "${{ secrets.AZURE_CDN_PROFILE }}" ] && [ ! -z "${{ secrets.AZURE_CDN_ENDPOINT }}" ]; then
              az cdn endpoint purge \
                --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
                --profile-name ${{ secrets.AZURE_CDN_PROFILE }} \
                --name ${{ secrets.AZURE_CDN_ENDPOINT }} \
                --content-paths "/*"
              echo "CDN cache purged successfully"
            else
              echo "CDN purge skipped - no CDN configuration provided"
            fi

      - name: Logout from Azure
        run: |
          az logout
        if: always()
