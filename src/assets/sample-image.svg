<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f0f0f0" rx="10"/>
  
  <!-- CDN Icon - Cloud shape -->
  <ellipse cx="200" cy="120" rx="80" ry="50" fill="url(#grad1)" opacity="0.8"/>
  <ellipse cx="160" cy="110" rx="50" ry="35" fill="url(#grad1)" opacity="0.9"/>
  <ellipse cx="240" cy="110" rx="50" ry="35" fill="url(#grad1)" opacity="0.9"/>
  
  <!-- Network nodes -->
  <circle cx="100" cy="200" r="15" fill="#667eea"/>
  <circle cx="200" cy="220" r="15" fill="#667eea"/>
  <circle cx="300" cy="200" r="15" fill="#667eea"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="200" x2="200" y2="140" stroke="#764ba2" stroke-width="3" opacity="0.6"/>
  <line x1="300" y1="200" x2="200" y2="140" stroke="#764ba2" stroke-width="3" opacity="0.6"/>
  <line x1="100" y1="200" x2="300" y2="200" stroke="#764ba2" stroke-width="3" opacity="0.6"/>
  
  <!-- Text -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="24" fill="#333" text-anchor="middle" font-weight="bold">CDN Asset</text>
</svg>
